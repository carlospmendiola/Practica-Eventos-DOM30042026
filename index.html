<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica Eventos DOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Old+Standard+TT:wght@400;700&display=swap"
  rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="center borderBottom1px">
    <h1 class="lh-titles mayusculas colorPrincipal">Filtro Imágenes</h1>
  </header>
  <nav class="fondoPrincipal center borderBottom1px">
    <h2>Etiquetas</h2>
    <p class="lh-texto">Pulsa en las etiquetas para ver las imágenes</p>
    <div id="listBotones" class="containerBotones">
      <!-- Aquí insertamos el listado de los botones con las etiquetas -->
    </div>
  </nav>
  <main>
    <div id="txtPresentacion" class="mb20px">
      <!-- Aquí va el texto que nos indica cuántas imágenes de cada categoría -->
    </div>
    <h2 class="center">Imagen destacada</h2>
    <div id="imagenPrincipal" class="imgEtiqueta borderNormal borderRadius10">
      <!-- Aquí se pinta la imagen principal que cambia dependiendo de la categoría seleccionada -->
    </div>
    <h2 class="center">Imagen relacionadas</h2>
    <div id="imgSecundarias" class="containerImagenes">
      <!-- Aquí se pintan las imagenes secundarias en el caso que hayan más en la categoría seleccionada -->
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
